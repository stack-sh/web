<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Write Stack architecture diagrams and render deterministic SVG in your browser."
    />
    <title>Stack Playground</title>
    <script>
      ;(() => {
        let savedMode = null
        try {
          savedMode = localStorage.getItem("stack-color-mode")
        } catch {
          // Use the system preference when storage is unavailable.
        }
        const useDark =
          savedMode === "dark" ||
          (savedMode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", useDark)
        document.documentElement.style.colorScheme = useDark ? "dark" : "light"
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
